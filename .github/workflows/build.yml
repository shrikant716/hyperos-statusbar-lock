name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Check no INTERNET permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: status-bar-lock-apk
          path: app/build/outputs/apk/**/*.apk
